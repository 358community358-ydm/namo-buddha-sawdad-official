<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>१४ एप्रिल - Namo Buddha Sawdad</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(to right, #0d6efd, #003366);
    color: white;
}

header {
    text-align: center;
    padding: 30px 15px;
}

.container {
    background: white;
    color: black;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    width: 100%;
}

button {
    background: #0d6efd;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #003366;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid gray;
    padding: 8px;
    text-align: center;
}

th {
    background: #0d6efd;
    color: white;
}

.total-box {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

.remaining {
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    margin-top: 15px;
    color: green;
}

.admin-panel {
    display: none;
}
</style>
</head>

<body>

<header>
<h1>१४ एप्रिल २०२६ - भारत रत्न डॉ. बाबासाहेब आंबेडकर जयंती</h1>
<p>स्थळ: बुद्ध विहार, Sawdad</p>
</header>

<div class="container">

<h2>वर्गणी यादी</h2>

<table>
<thead>
<tr>
<th>नाव</th>
<th>रक्कम (₹)</th>
</tr>
</thead>

<tbody id="donationList">
<tr>
<td>योगेश दत्तात्रय मोरे</td>
<td>1000</td>
</tr>

<tr>
<td>वैभव आंबादास इंगळे</td>
<td>2000</td>
</tr>

    
</tbody>

</table>

<div class="total-box">
वर्गणी एकूण: ₹ <span id="donationTotal">0</span>
</div>

<hr>

<h2>खर्च यादी</h2>

<table>
<thead>
<tr>
<th>खर्च प्रकार</th>
<th>रक्कम (₹)</th>
</tr>
</thead>

<tbody id="expenseList">
</tbody>

</table>

<div class="total-box">
खर्च एकूण: ₹ <span id="expenseTotal">0</span>
</div>

<hr>

<div class="remaining">
उरलेली रक्कम: ₹ <span id="remainingAmount">0</span>
</div>

<hr>

<h2>Admin Login</h2>
<input type="password" id="adminPassword" placeholder="Password टाका">
<button onclick="login()">Login</button>

<div class="admin-panel" id="adminPanel">

<h3>वर्गणी जोडा</h3>
<input type="text" id="name" placeholder="नाव (मराठीत)">
<input type="number" id="amount" placeholder="रक्कम (₹)">
<button onclick="addDonation()">जोडा</button>

<h3>खर्च जोडा</h3>
<input type="text" id="expenseName" placeholder="खर्च प्रकार">
<input type="number" id="expenseAmount" placeholder="रक्कम (₹)">
<button onclick="addExpense()">खर्च जोडा</button>

</div>

</div>

<script>

var correctPassword = "Aarviaarvi19@";

function login() {
    var pass = document.getElementById("adminPassword").value;
    if(pass === correctPassword){
        document.getElementById("adminPanel").style.display = "block";
        alert("Admin Login Successful");
    } else {
        alert("Wrong Password");
    }
}

function calculateTotals() {

    var donationTotal = 0;
    var expenseTotal = 0;

    var donationRows = document.querySelectorAll("#donationList tr");
    donationRows.forEach(function(row){
        donationTotal += Number(row.cells[1].innerText);
    });

    var expenseRows = document.querySelectorAll("#expenseList tr");
    expenseRows.forEach(function(row){
        expenseTotal += Number(row.cells[1].innerText);
    });

    document.getElementById("donationTotal").innerText = donationTotal;
    document.getElementById("expenseTotal").innerText = expenseTotal;
    document.getElementById("remainingAmount").innerText = donationTotal - expenseTotal;
}

function addDonation() {

    var name = document.getElementById("name").value;
    var amount = document.getElementById("amount").value;

    if(name === "" || amount === "") {
        alert("माहिती भरा");
        return;
    }

    var table = document.getElementById("donationList");
    var row = table.insertRow();
    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = amount;

    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";

    calculateTotals();
}

function addExpense() {

    var name = document.getElementById("expenseName").value;
    var amount = document.getElementById("expenseAmount").value;

    if(name === "" || amount === "") {
        alert("माहिती भरा");
        return;
    }

    var table = document.getElementById("expenseList");
    var row = table.insertRow();
    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = amount;

    document.getElementById("expenseName").value = "";
    document.getElementById("expenseAmount").value = "";

    calculateTotals();
}

calculateTotals();

</script>

</body>
</html>
